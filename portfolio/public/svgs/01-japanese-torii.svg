<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- crescent moon -->
    <path d="M68 30 A16 16 0 1 0 68 58" stroke="#cf8b5c" stroke-width="2.2"/>
    <!-- cherry blossom petals -->
    <g fill="#f2f1ee" stroke="#a8a6a0" stroke-width="1.3">
      <path d="M0 0 Q8 -7 17 0 Q8 7 0 0 Z" transform="translate(176 36) rotate(-24)"/>
      <path d="M0 0 Q7 -6 15 0 Q7 6 0 0 Z" transform="translate(198 56) rotate(28)"/>
      <path d="M0 0 Q5 -4 11 0 Q5 4 0 0 Z" transform="translate(158 58) rotate(62)" opacity="0.7"/>
    </g>

    <!-- pillars (drawn first, beams overlap) -->
    <path d="M74 92 H86 L82 206 H68 Z" fill="#f2f1ee" stroke="#a8a6a0" stroke-width="1.8"/>
    <path d="M170 92 H182 L188 206 H174 Z" fill="#f2f1ee" stroke="#a8a6a0" stroke-width="1.8"/>
    <path d="M83 98 L79.5 200" stroke="#a8a6a0" stroke-width="0.9" opacity="0.55"/>
    <path d="M179 98 L184 200" stroke="#a8a6a0" stroke-width="0.9" opacity="0.55"/>

    <!-- kasagi : curved upper beam -->
    <path d="M34 86 Q128 62 222 86 L219 97 Q128 74 37 97 Z" fill="#f2f1ee" stroke="#a8a6a0" stroke-width="1.8"/>
    <path d="M46 92 Q128 71 210 92" stroke="#a8a6a0" stroke-width="0.9" opacity="0.5"/>

    <!-- shimaki : lower flat beam -->
    <path d="M52 101 H204 V112 H52 Z" fill="#f2f1ee" stroke="#a8a6a0" stroke-width="1.6"/>

    <!-- gakuzuka : centre plaque -->
    <path d="M121 112 H135 V129 H121 Z" stroke="#cf8b5c" stroke-width="1.8" fill="none"/>

    <!-- nuki : tie beam -->
    <path d="M58 129 H198 V141 H58 Z" fill="#f2f1ee" stroke="#a8a6a0" stroke-width="1.7"/>
    <path d="M64 135 H192" stroke="#a8a6a0" stroke-width="0.9" opacity="0.45"/>

    <!-- base stones -->
    <path d="M62 206 H90 L88 214 H60 Z" fill="#f2f1ee" stroke="#a8a6a0" stroke-width="1.5"/>
    <path d="M166 206 H194 L196 214 H168 Z" fill="#f2f1ee" stroke="#a8a6a0" stroke-width="1.5"/>
    <path d="M42 220 H214" stroke="#a8a6a0" stroke-width="1.1" opacity="0.45"/>
  </g>
</svg>
