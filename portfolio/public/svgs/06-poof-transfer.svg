<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="poofTrail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#cf8b5c" stop-opacity="0"/>
      <stop offset="1" stop-color="#cf8b5c" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- container, broken open at the top-right corner -->
    <path d="M124 78 H62 A16 16 0 0 0 46 94 V192 A16 16 0 0 0 62 208 H158 A16 16 0 0 0 174 192 V134"
          stroke="#a8a6a0" stroke-width="4" fill="none"/>
    <!-- inner hairline for layered depth -->
    <path d="M118 92 H66 A6 6 0 0 0 60 98 V188 A6 6 0 0 0 66 194 H154 A6 6 0 0 0 160 188 V140"
          stroke="#a8a6a0" stroke-width="1.1" opacity="0.45" fill="none"/>

    <!-- trailing speed lines -->
    <path d="M78 168 L112 134" stroke="url(#poofTrail)" stroke-width="2"/>
    <path d="M100 190 L134 156" stroke="url(#poofTrail)" stroke-width="1.5" opacity="0.7"/>

    <!-- escaping arrow -->
    <path d="M96 160 L198 58" stroke="#cf8b5c" stroke-width="3.6"/>
    <path d="M198 58 L174 68 M198 58 L188 82" stroke="#cf8b5c" stroke-width="3.6"/>
  </g>
</svg>
